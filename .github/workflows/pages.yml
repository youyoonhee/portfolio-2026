# Push to main = VERIFY ONLY (privacy scans, artifact allowlist, noindex, reference check).
# Publishing happens only on a manual workflow_dispatch, after the D-04 screenshot gate and D-03 approval.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Privacy scan self-test
        run: node tools/check-repo.mjs --self-test
      - name: Privacy scan (tree)
        run: node tools/check-repo.mjs
      - name: Privacy scan (history)
        run: node tools/check-repo.mjs --history
      - name: Content checks
        run: node tools/check-content.mjs
      - name: Colophon record check
        run: node tools/colophon-sync.mjs --check
      - name: Stage allowlisted files
        run: node tools/stage-pages.mjs dist/site
      - name: Verify artifact allowlist
        run: node tools/check-artifact.mjs dist/site
      - name: Artifact verifier self-test
        run: node tools/check-artifact.mjs --self-test
      - name: Privacy scan (artifact)
        run: node tools/check-repo.mjs --dir dist/site
      - name: Configure Pages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
