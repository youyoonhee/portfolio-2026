<!DOCTYPE html>
<!--
  OG 카드 렌더 소스. tools/make-og.mjs가 헤드리스 Chrome으로 1200x630 PNG를 뽑는 용도로만 쓰고, 사이트에는 배포하지 않는다(tools/는 배포 대상 밖).
  텍스트는 세 줄뿐이다. 이메일, 전화번호, 연도, 점수는 넣지 않는다.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>OG card</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/fonts-print.css">
  <style>
    html, body { margin: 0; }
    body {
      position: relative;
      inline-size: 1200px;
      block-size: 630px;
      overflow: hidden;
      background: var(--color-bg);
      font-family: "Pretendard Print", sans-serif;
    }
    .panel {
      position: absolute;
      inset-inline-start: 40px;
      inset-block-start: 40px;
      inline-size: 1120px;
      block-size: 550px;
      background: var(--color-surface);
      border-radius: var(--radius-lg);
    }
    .item { position: absolute; inset-inline-start: 104px; margin: 0; white-space: nowrap; }
    .mark { inset-block-start: 98px; font-size: 32px; font-weight: 600; line-height: 1.2; letter-spacing: 0.04em; color: var(--color-accent); }
    .name { inset-block-start: 258px; font-size: 160px; font-weight: 600; line-height: 1.05; letter-spacing: -0.03em; color: var(--color-ink); }
    .role { inset-block-start: 440px; font-size: 48px; font-weight: 400; line-height: 1.3; color: var(--color-ink-2); }
  </style>
</head>
<body>
  <div class="panel"></div>
  <p class="item mark" lang="en">PORTFOLIO.</p>
  <p class="item name">유윤희</p>
  <p class="item role">앱, 반응형 웹 퍼블리셔</p>
</body>
</html>
